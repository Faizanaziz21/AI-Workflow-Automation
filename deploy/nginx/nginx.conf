worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 26m;
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  # Edge rate limits (the API applies finer per-identity GCRA limits in Redis).
  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream api { server api:8000; keepalive 64; }
  upstream web { server web:3000; keepalive 32; }

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"request_id":"$req_id"}';
  access_log /dev/stdout json;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;

    location = /metrics { return 404; }          # scraped on the internal network only
    location /api/v1/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://api; }
    location /api/v1/hooks/ { limit_req zone=api burst=500 nodelay; proxy_read_timeout 60s; proxy_pass http://api; }
    location /api/ { limit_req zone=api burst=200 nodelay; proxy_pass http://api; }
    location ~ ^/(docs|redoc|openapi.json|healthz|readyz)$ { proxy_pass http://api; }
    location / { proxy_pass http://web; }
  }
}
