# Two replicas for availability; a Postgres advisory lock elects a single active leader.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels: { app.kubernetes.io/name: scheduler }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: scheduler } }
  template:
    metadata: { labels: { app.kubernetes.io/name: scheduler } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: scheduler
          image: flowforge/backend
          args: ["python", "-m", "app.workers.scheduler"]
          envFrom: [{ configMapRef: { name: flowforge-config } }, { secretRef: { name: flowforge-secrets } }]
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
