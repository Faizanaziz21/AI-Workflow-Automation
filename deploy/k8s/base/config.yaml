apiVersion: v1
kind: ConfigMap
metadata:
  name: flowforge-config
data:
  FF_ENV: production
  FF_LOG_JSON: "true"
  FF_TRUSTED_PROXIES: "1"
  FF_PUBLIC_BASE_URL: https://flowforge.example.com
  FF_CORS_ORIGINS: https://flowforge.example.com
  FF_ALLOW_PRIVATE_NETWORK_EGRESS: "false"
  FF_EMBEDDED_SCHEDULER: "false"
  FF_WORKER_CONCURRENCY: "32"
  FF_DB_POOL_SIZE: "20"          # API pods; workers size their pool to FF_WORKER_CONCURRENCY + 8
  FF_OTEL_EXPORTER_ENDPOINT: http://otel-collector.observability:4318
---
# Secrets are expected to be synced from a vault (External Secrets Operator / Sealed Secrets).
# This manifest documents the required keys; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: flowforge-secrets
type: Opaque
stringData:
  FF_DATABASE_URL: postgresql+asyncpg://flowforge:CHANGE_ME@postgres.example.internal:5432/flowforge
  FF_REDIS_URL: rediss://:CHANGE_ME@redis.example.internal:6379/0
  FF_JWT_SECRET: CHANGE_ME
  FF_ENCRYPTION_KEYS: '{"v1":"CHANGE_ME_BASE64_32_BYTES"}'
  FF_ACTIVE_ENCRYPTION_KEY: v1
