global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: flowforge-api
    dns_sd_configs: [{ names: ["api"], type: A, port: 8000 }]
    metrics_path: /metrics
  - job_name: flowforge-worker
    dns_sd_configs: [{ names: ["worker"], type: A, port: 9101 }]
