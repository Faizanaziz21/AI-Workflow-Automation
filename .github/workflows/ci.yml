name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: flowforge, POSTGRES_PASSWORD: flowforge, POSTGRES_DB: flowforge_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U flowforge" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Migration drift check
        env: { FF_DATABASE_URL: "postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge_test" }
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest -q --maxfail=5

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: flowforge, POSTGRES_PASSWORD: flowforge, POSTGRES_DB: flowforge }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U flowforge" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      FF_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
      FF_ALLOW_PRIVATE_NETWORK_EGRESS: "true"
      FF_LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start platform
        run: |
          pip install -e "./backend" "fastapi" "uvicorn[standard]"
          (cd backend && alembic upgrade head)
          (cd mock-services && nohup uvicorn sandbox.app:app --port 9000 > sandbox.log 2>&1 &)
          (cd backend && nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &)
          (cd backend && nohup python -m app.workers.worker > worker.log 2>&1 &)
          sleep 5
          (cd backend && python -m app.cli seed-demo --sandbox-url http://localhost:9000 --executions 12)
          sleep 15
      - name: Build and start console
        working-directory: frontend
        run: |
          npm ci && npm run build
          FF_API_URL=http://localhost:8000 nohup npm start > web.log 2>&1 &
          npx playwright install --with-deps chromium
          sleep 5
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            backend/*.log
            frontend/test-results
            frontend/web.log

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: web, context: frontend }
          - { name: sandbox, context: mock-services }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/flowforge-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
