[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "1.0.0"
description = "FlowForge AI — Enterprise Workflow Automation Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "redis>=5.0",
    "httpx>=0.27",
    "cryptography>=43",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "jsonschema>=4.23",
    "prometheus-client>=0.20",
    "croniter>=3.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "aiosmtplib>=3.0",
    "aiomysql>=0.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "anthropic>=1.11",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "S101",   # assert in tests
    "B008",   # FastAPI Depends in defaults
    "RUF012", # mutable class attrs used for declarative specs
    "S105", "S106", # false positives on 'token'/'password' identifiers
    "RUF001", "RUF002", "RUF003",
    "UP042",
    "E501",     # formatter owns line length; long literals allowed
    "ASYNC109", # explicit timeout params are part of connector contracts
    "S608",     # SQL built from validated identifiers only (see sqlutil)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
